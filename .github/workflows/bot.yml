name: Bot

# Cron: 9:17 a 19:17 de Lima (UTC-5), una corrida por hora, sobre la temporada real. Candado: si
# data/temporadas/<temporada real>/temporada.json no existe, la corrida programada termina en verde sin
# hacer nada. Arrancar la temporada = crear esa carpeta y pushearla.
on:
  schedule:
    - cron: "17 14-23,0 * * *"
  workflow_dispatch:
    inputs:
      temporada:
        description: "Id de la temporada (carpeta en data/temporadas/)"
        required: true
        type: string
      pagina:
        description: "dry-run = sin --pagina; real = --pagina real"
        required: true
        type: choice
        options:
          - dry-run
          - real
        default: dry-run

permissions:
  contents: write

concurrency:
  group: pfb-bot
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # en el cron no hay inputs: va la temporada real con --pagina real
      TEMPORADA: ${{ inputs.temporada || 'pfbot1-2026.1' }}
      PAGINA: ${{ inputs.pagina || 'real' }}
    steps:
      - uses: actions/checkout@v7

      - name: Candado (solo el cron)
        if: github.event_name == 'schedule'
        run: |
          if [ ! -f "data/temporadas/$TEMPORADA/temporada.json" ]; then
            echo "La temporada $TEMPORADA no existe todavía: no se hace nada."
            echo "SALTAR=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v7
        if: env.SALTAR != '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        if: env.SALTAR != '1'
        run: pip install -r requirements.txt

      - name: Validar temporada
        if: env.SALTAR != '1'
        run: |
          case "$TEMPORADA" in
            prueba-*)
              echo "::error::La temporada '$TEMPORADA' empieza con 'prueba-': esas carpetas están en .gitignore y el estado no se guardaría."
              exit 1
              ;;
          esac

      - name: Escribir .env
        if: env.SALTAR != '1'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_API_VERSION: ${{ secrets.FB_API_VERSION }}
        run: |
          umask 077
          {
            printf 'FB_PAGE_ID=%s\n' "$FB_PAGE_ID"
            printf 'FB_PAGE_TOKEN=%s\n' "$FB_PAGE_TOKEN"
            printf 'IG_USER_ID=%s\n' "$IG_USER_ID"
            if [ -n "$FB_API_VERSION" ]; then
              printf 'FB_API_VERSION=%s\n' "$FB_API_VERSION"
            fi
          } > .env

      - name: Correr
        if: env.SALTAR != '1'
        run: |
          if [ "$PAGINA" = "real" ]; then
            python -m pfb.publicacion.correr "$TEMPORADA" --pagina real
          else
            python -m pfb.publicacion.correr "$TEMPORADA"
          fi

      - name: Commit y push
        if: always() && env.SALTAR != '1'
        run: |
          case "$TEMPORADA" in
            prueba-*) echo "Temporada de prueba: no se commitea."; exit 0 ;;
          esac
          carpeta="data/temporadas/$TEMPORADA"
          if [ ! -d "$carpeta" ]; then
            echo "No existe $carpeta: no hay nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$carpeta"
          if git diff --cached --quiet; then
            echo "Sin cambios en $carpeta."
            exit 0
          fi
          fecha=$(TZ=America/Lima date '+%d/%m/%Y %H:%M')
          git commit -m "Temporada $TEMPORADA: corrida $fecha"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Borrar .env
        if: always()
        run: rm -f .env
